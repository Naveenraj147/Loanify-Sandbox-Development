<template>
    <div>
        <div style="text-align: center; margin-top: 20px;">
            <img src={imageUrl} alt="Logo" />
        </div>
       
        <div class="box-1">
            <div class="heading">Communication Settings</div>
            <div class="sub-heading">Manage how and where you want to receive communications from us</div>
        </div>
        <div class="box-2">
            <table>
                <th></th>
                <th>Email</th>
                <th>SMS</th>
                <tr>
                    <td>
                        All Notifications
                    </td>
                    <td>
                        <div class="checkbox">
                            <input name="Email-All" type="checkbox" onchange={handleOnChange}>
                        </div>
                    </td>
                    <td>
                        <div class="checkbox">
                            <input name="SMS-All" type="checkbox"  onchange={handleOnChange}> 
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        Credit Union Notifications
                    </td>
                    <td>
                        <div class="checkbox">
                            <input name="Email-CU" type="checkbox" checked={checkboxValue.Email.creditUnionNotifications} onchange={handleOnChange}>
                        </div>
                    </td>
                    <td>
                        <div class="checkbox">
                            <input name="SMS-CU" type="checkbox" checked={checkboxValue.SMS.creditUnionNotifications} onchange={handleOnChange}>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        Dealer Notifications
                    </td>
                    <td>
                        <div class="checkbox">
                            <input name="Email-D" type="checkbox" checked={checkboxValue.Email.dealerNotifications} onchange={handleOnChange}>
                        </div>
                    </td>
                    <td>
                        <div class="checkbox">
                            <input name="SMS-D" type="checkbox"  checked={checkboxValue.SMS.dealerNotifications} onchange={handleOnChange}>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        FastPass Team Support
                    </td>
                    <td>
                        <div class="checkbox" >
                            <input name="Email-FPT" type="checkbox" checked={checkboxValue.Email.fastpassSuport}  onchange={handleOnChange}>
                        </div>
                    </td>
                    <td>
                        <div class="checkbox">
                            <input name="SMS-FPT" type="checkbox" checked={checkboxValue.SMS.fastpassSuport} onchange={handleOnChange}>
                        </div>
                    </td>
                </tr>
            </table>
        </div>

    </div>
    <div style="text-align: center; margin-top: 20px;">
        <button class="button" role="button">Update Preferences</button>
    </div>

</template>
